name: polymeet

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polymeet
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - path: .env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=3001
    volumes:
      - ./data:/app/data
    networks:
      - default
      - frontend

networks:
  frontend:
    external: true
    name: uni-services_frontend
